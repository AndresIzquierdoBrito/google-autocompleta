packages:
  - apps/client

allowBuilds:
  # fsevents is an optional native watcher dependency pulled by the legacy
  # Expo 44 toolchain. It is not required for the app to run, and disabling
  # its install script keeps pnpm installs reproducible on modern Node hosts.
  fsevents: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.24'
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo@57.0.22

nodeLinker: hoisted
