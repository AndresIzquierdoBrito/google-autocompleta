[project]
name = "google-autocompleta-api"
version = "1.0.0"
description = "API de juego para Google Autocompleta"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.22.1,<1",
  "alembic>=1.18.4,<2",
  "fastapi[standard]>=0.135.1,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.13.1,<3",
  "sqlalchemy[asyncio]>=2.0.48,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.19.1,<2",
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "respx>=0.22.0,<1",
  "ruff>=0.15.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_autocompleta"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true
